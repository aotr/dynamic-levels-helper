name: E2E Browser Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dynamic_levels_test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, filter, gd, hash, json, mbstring, openssl, pcre, pdo, sqlite, tokenizer, xml
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Install Node dependencies
        run: npm install
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Create .env for tests
        run: |
          cp .env.example .env.test || echo "APP_KEY=base64:dummykey" > .env.test
          echo "DB_CONNECTION=mysql" >> .env.test
          echo "DB_HOST=127.0.0.1" >> .env.test
          echo "DB_PORT=3306" >> .env.test
          echo "DB_DATABASE=dynamic_levels_test" >> .env.test
          echo "DB_USERNAME=root" >> .env.test
          echo "DB_PASSWORD=root" >> .env.test
      
      - name: Generate app key
        run: php artisan key:generate --env=test
      
      - name: Run migrations
        run: php artisan migrate --env=test --seed --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dynamic_levels_test
          DB_USERNAME: root
          DB_PASSWORD: root
      
      - name: Run Playwright tests
        run: npm test
        env:
          BASE_URL: http://localhost:8000
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src --level=5
      
      - name: Run Pint (PHP Code Style)
        run: ./vendor/bin/pint --check
